apiVersion: v1
kind: ConfigMap
metadata:
  name: fina-config
  namespace: fina
  labels:
    app.kubernetes.io/name: fina
data:
  SPRING_PROFILES_ACTIVE: prod
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DATABASE: "0"
  FINA_BACKUP_ENABLED: "true"
  FINA_BACKUP_CRON: "0 0 * * * *"
  FINA_BACKUP_DIRECTORY: /backups
  FINA_REDIS_DUMP_PATH: /redis-data/dump.rdb
  FINA_BACKUP_MAX_AGE: 2h
  FINA_INVOICE_OVERDUE_CRON: "0 5 0 * * *"
