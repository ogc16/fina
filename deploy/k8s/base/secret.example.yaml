# Reference only. Do not commit real credentials.
# Create the real secret with:
#   kubectl -n fina create secret generic fina-secrets \
#     --from-literal=FINA_USERNAME=fina \
#     --from-literal=FINA_PASSWORD='change-me' \
#     --from-literal=REDIS_PASSWORD='change-me-too'
apiVersion: v1
kind: Secret
metadata:
  name: fina-secrets
  namespace: fina
  labels:
    app.kubernetes.io/name: fina
type: Opaque
stringData:
  FINA_USERNAME: fina
  FINA_PASSWORD: change-me
  REDIS_PASSWORD: change-me-too
