apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fina
  namespace: fina
  labels:
    app.kubernetes.io/name: fina
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - fina.example.com
      secretName: fina-tls
  rules:
    - host: fina.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fina
                port:
                  name: http
