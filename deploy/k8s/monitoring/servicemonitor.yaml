apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fina
  namespace: fina
  labels:
    app.kubernetes.io/name: fina
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - fina
  selector:
    matchLabels:
      app.kubernetes.io/name: fina
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /actuator/prometheus
      scheme: http
      interval: 15s
      scrapeTimeout: 10s
      basicAuth:
        username:
          name: fina-secrets
          key: FINA_USERNAME
        password:
          name: fina-secrets
          key: FINA_PASSWORD
